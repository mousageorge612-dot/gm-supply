<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة تحكم GM Supply</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/styles.css?v=1">
<style>
.login{max-width:360px;margin:12vh auto 0;padding:0 16px;text-align:center}
.login img{width:240px;margin:0 auto 18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.it .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.it h3{margin:0;font-size:16px}
.it small{color:var(--muted)}
.it ul{margin:8px 0;padding-inline-start:18px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:900;background:#333}
.st-new{background:var(--gold);color:#000}.st-confirmed{background:#3a7bff;color:#fff}.st-paid{background:#8a5cff;color:#fff}
.st-shipped{background:#00b3b3;color:#000}.st-delivered{background:var(--green);color:#000}.st-cancelled{background:#552222;color:#fbb}
.prow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.prow .im{width:64px;height:64px;background:#fff;border-radius:10px;overflow:hidden}
.prow .im img{width:100%;height:100%;object-fit:contain}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;color:var(--gold);font-size:20px}
.stats span{color:var(--muted);font-size:12px}
.imgprev{width:120px;height:120px;background:#fff;border-radius:12px;overflow:hidden;margin-bottom:6px}
.imgprev img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../" target="_blank"><img src="../assets/img/logo-h.webp" alt="GM Supply" width="176" height="39"></a>
  <button class="btn ghost sm" id="out" hidden>خروج</button>
</div></header>
<main class="wrap" id="app"></main>
<script src="../assets/core.js?v=1"></script>
<script src="../assets/admin.js?v=1"></script>
</body>
</html>
